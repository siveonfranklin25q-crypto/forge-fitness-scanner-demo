name: FORGE training engine

on:
  pull_request:
    paths:
      - "src/training-programs/**"
      - "tests/training-programs/**"
      - ".github/workflows/forge-training-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check every module
        run: for f in $(find src/training-programs -name '*.js'); do node --check "$f"; done
      - name: Unit tests (synthetic data, no network)
        run: node --test tests/training-programs/*.test.mjs
