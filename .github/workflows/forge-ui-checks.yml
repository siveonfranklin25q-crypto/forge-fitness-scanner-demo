name: FORGE UI review checks

on:
  pull_request:
    paths:
      - "index.html"
      - "forge-ui.css"
      - "forge-ui.js"
      - "forge-immersive.css"
      - "forge-immersive.js"
      - "forge-avatar.js"
      - "forge-avatar.css"
      - "tests/**"
      - ".github/workflows/forge-ui-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check forge-ui.js
          node --check forge-immersive.js
          node --check forge-avatar.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">([\s\S]*?)</script>', html)
          assert scripts, "Embedded module missing"
          Path("/tmp/forge-inline.mjs").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/forge-inline.mjs
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium --with-deps
      - name: Validate responsive navigation and interactions
        run: python tests/ui_refresh_smoke.py
      - name: Validate real WebGL GLB rendering without likeness data
        run: python tests/real_3d_smoke.py
      - name: Preserve v0.8 strength-tracker behavior
        run: python tests/strength_tracker_smoke.py
      - name: Save design review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-interface-review
          path: ui-review-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
